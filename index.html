<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SG청운학원 통합 시스템</title>
  
  <!-- 탭 아이콘 (파비콘) -->
  <link rel="icon" href="https://i.imgur.com/tFbBVcO.png">
  
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  
  <style>
    * { box-sizing: border-box; }
    
    body { 
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
      margin: 0; 
      padding: 0; 
      background-color: #e2e8f0; 
      color: #333; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 스크롤 방지용 배경 래퍼 */
    .bg-shapes-wrap {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      overflow: hidden;
      z-index: -2;
    }

    /* 배경 원형 동그라미 (오브젝트) */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px); 
      animation: float 12s infinite ease-in-out alternate;
    }
    .shape1 {
      width: 450px; height: 450px;
      background: #ffb6c1; 
      top: -100px; left: -150px;
    }
    .shape2 {
      width: 550px; height: 550px;
      background: #a1c4fd; 
      bottom: -150px; right: -150px;
      animation-delay: -3s;
    }
    .shape3 {
      width: 350px; height: 350px;
      background: #c2e9fb; 
      top: 40%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -6s;
    }

    /* 배경 동그라미 애니메이션 */
    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.05); }
    }

    /* 전체 화면을 덮는 살짝 투명한 블러 레이어 */
    .glass-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.4); 
      backdrop-filter: blur(40px); 
      -webkit-backdrop-filter: blur(40px);
      z-index: -1;
    }

    .portal-container {
      width: 100%;
      max-width: 700px; 
      padding: 80px 25px 40px 25px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1; 
    }

    .portal-header {
      text-align: center;
      margin-bottom: 20px; 
    }

    .portal-title {
      font-size: 60px; 
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1.2;
      margin: 0;
      white-space: nowrap; 
      background: linear-gradient(90deg, #1366ce, #e83e8c, #1366ce);
      background-size: 200% auto;
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 4s linear infinite;
    }

    .portal-subtitle {
      font-size: 15px;
      color: #555;
      margin-top: 15px;
      font-weight: 600;
    }

    /* 카드 그룹 레이아웃 (너비 제한 및 중앙 정렬) */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 30px;
      width: 100%;
      max-width: 560px; 
      margin: auto;     
    }

    /* 🟢 글래스모피즘 적용된 앱 카드 (위쪽 내용물을 더 내림) */
    .app-card {
      background: rgba(255, 255, 255, 0.6); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 24px;
      padding: 80px 20px 35px 20px; /* 💡 상(80) 우(20) 하(35) 좌(20) 여백 */
      min-height: 380px; /* 💡 바로 이 부분을 줄여주시면 됩니다! (예: 320px) */
      text-decoration: none;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s, background 0.3s;
    }

    .app-card:hover {
      transform: translateY(-8px);
      background: rgba(255, 255, 255, 0.8);
      box-shadow: 0 15px 35px rgba(19, 102, 206, 0.1);
      border-color: rgba(255, 255, 255, 1);
    }

    /* 아이콘 박스 */
    .icon-wrap {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      margin-bottom: 25px;
      backdrop-filter: blur(10px); 
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .icon-checklist { background-color: rgba(40, 167, 69, 0.15); color: #28a745; }
    .icon-report { background-color: rgba(19, 102, 206, 0.15); color: #1366ce; }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 12px 0;
      color: #111;
    }

    .app-desc {
      font-size: 13px;
      color: #555;
      line-height: 1.5;
      margin: 0;
      word-break: keep-all;
    }

    /* 접속 버튼 */
    .enter-btn {
      margin-top: auto; 
      padding: 10px 24px;
      border-radius: 50px;
      background-color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: #495057;
      font-size: 13px;
      font-weight: bold;
      transition: 0.3s;
      backdrop-filter: blur(5px);
    }

    .app-card:hover .enter-btn {
      background-color: #1366ce;
      border-color: #1366ce;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(19, 102, 206, 0.3);
    }

    /* 하단 로고 영역 */
    .portal-footer {
      margin-top: 0; 
      padding-top: 40px; 
      text-align: center;
    }

    .portal-logo {
      height: 32px;
      opacity: 0.7;
      transition: 0.3s;
    }
    
    .portal-logo:hover {
      opacity: 1;
    }

    @keyframes shine { 
      to { background-position: 200% center; } 
    }

    /* 모바일 해상도 대응 */
    @media (max-width: 680px) {
      .portal-title { font-size: 8vw; white-space: nowrap; } 
    }
    @media (max-width: 500px) {
      .portal-title { font-size: 38px; white-space: normal; } 
      .app-grid { grid-template-columns: 1fr; max-width: 320px; } 
    }
  </style>
</head>
<body>

  <!-- 배경 스크롤 방지 래퍼 -->
  <div class="bg-shapes-wrap">
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>
  </div>
  
  <div class="glass-overlay"></div>

  <div class="portal-container">
    <div class="portal-header">
      <h1 class="portal-title">Student Management<br>System</h1>
      <p class="portal-subtitle">SG청운학원 통합 업무 포털입니다.</p>
    </div>

    <!-- 좌우 2열 배치 및 상하 중앙 정렬 -->
    <div class="app-grid">
      <a href="https://cw-checklist.vercel.app" target="_blank" class="app-card">
        <div class="icon-wrap icon-checklist">
          <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <h2 class="app-title">체크리스트</h2>
        <p class="app-desc">수업 세부 사항을 작성하고<br>학부모 발송을 관리하는 시스템입니다.</p>
        <div class="enter-btn">시스템 접속</div>
      </a>

      <a href="https://cw-reportcard.vercel.app/" target="_blank" class="app-card">
        <div class="icon-wrap icon-report">
          <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
        <h2 class="app-title">레벨테스트</h2>
        <p class="app-desc">학생들의 LT 성적을 입력하고<br>개별 성적표를 출력하는 시스템입니다.</p>
        <div class="enter-btn">시스템 접속</div>
      </a>
    </div>

    <div class="portal-footer">
      <img class="portal-logo" src="https://i.imgur.com/PQRrCSI.png" alt="SG청운학원">
    </div>
  </div>

</body>
</html>
